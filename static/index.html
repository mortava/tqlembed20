<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quinn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <style>
    :root {
      --primary: #000;
      --on-primary: #fff;
      --ink: #000;
      --charcoal: #525252;
      --body-color: #737373;
      --mute: #a3a3a3;
      --canvas: #fff;
      --surface-soft: #f4f4f4;
      --hairline: #e5e5e5;
      --hairline-strong: #d4d4d4;
      --surface-dark: #171717;
      --on-dark: #fff;
      --focus-ring: rgba(59,130,246,0.5);
      --input-bg: #f4f4f4;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--canvas);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Shell ── */
    .shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 800px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--hairline);
      flex-shrink: 0;
      background: var(--canvas);
    }

    .logo {
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      margin-right: auto;
    }

    .store-select {
      background: var(--surface-soft);
      border: none;
      border-radius: 9999px;
      padding: 6px 14px;
      height: 32px;
      font-size: 13px;
      color: var(--ink);
      cursor: pointer;
      outline: none;
      max-width: 200px;
      font-family: inherit;
    }
    .store-select:focus { box-shadow: 0 0 0 2px var(--focus-ring); }

    .btn-icon {
      width: 32px; height: 32px;
      background: none; border: none; cursor: pointer;
      border-radius: 9999px;
      display: flex; align-items: center; justify-content: center;
      color: var(--charcoal); font-size: 18px;
      transition: background 0.1s;
    }
    .btn-icon:hover { background: var(--surface-soft); }

    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #d4d4d4; flex-shrink: 0;
      transition: background 0.2s;
    }
    .status-dot.ready   { background: #27c93f; }
    .status-dot.loading { background: #ffbd2e; animation: pulse 1s infinite; }
    .status-dot.error   { background: #ff5f56; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
    }

    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 9999px; }

    /* Welcome / empty */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 40px 0;
      text-align: center;
    }
    .welcome-q {
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 56px; font-weight: 600; line-height: 1;
      color: var(--ink);
    }
    .welcome-title {
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 22px; font-weight: 500;
      color: var(--ink);
    }
    .welcome-sub { font-size: 14px; color: var(--body-color); }

    /* Messages */
    .messages { display: flex; flex-direction: column; gap: 0; padding: 20px 0; }

    .msg { display: flex; flex-direction: column; padding: 6px 0; }

    /* User message */
    .msg-user {
      align-items: flex-end;
      margin-bottom: 4px;
    }
    .msg-user .bubble {
      background: var(--surface-soft);
      border-radius: 18px 18px 4px 18px;
      padding: 10px 16px;
      font-size: 15px;
      line-height: 1.55;
      max-width: 78%;
      color: var(--ink);
    }

    /* AI message */
    .msg-ai { align-items: flex-start; }
    .msg-ai-inner { display: flex; gap: 12px; align-items: flex-start; max-width: 88%; }
    .ai-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--ink); color: var(--on-dark);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 13px; font-weight: 600;
      flex-shrink: 0; margin-top: 2px;
    }
    .ai-text {
      font-size: 15px; line-height: 1.65;
      color: var(--ink); padding-top: 4px;
    }
    .ai-text strong { font-weight: 600; }
    .ai-text code {
      background: var(--surface-soft);
      padding: 1px 7px; border-radius: 5px;
      font-family: ui-monospace, monospace; font-size: 13px;
    }

    /* Markdown rendering inside AI messages */
    .ai-text p { margin: 0 0 10px; }
    .ai-text p:last-child { margin-bottom: 0; }
    .ai-text strong { color: var(--ink); font-weight: 600; }
    .ai-text ul, .ai-text ol { margin: 6px 0 10px 22px; }
    .ai-text li { margin: 2px 0; }
    .ai-text code {
      background: var(--surface-soft);
      padding: 1px 5px; border-radius: 4px;
      font-family: ui-monospace, monospace; font-size: 0.92em;
    }
    .ai-text table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0 12px;
      font-size: 14px;
    }
    .ai-text th, .ai-text td {
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid var(--hairline);
      vertical-align: top;
    }
    .ai-text thead th {
      background: var(--surface-soft);
      font-weight: 600;
      color: var(--ink);
      border-bottom: 1px solid var(--hairline-strong);
      font-size: 13px;
      text-transform: none;
      letter-spacing: 0;
    }
    .ai-text tbody tr:last-child td { border-bottom: none; }
    .ai-text tbody tr:hover { background: rgba(0,0,0,0.015); }

    /* System msg */
    .sys-msg {
      text-align: center; padding: 8px 0;
      font-size: 12px; color: var(--mute);
      font-family: ui-monospace, monospace;
    }

    /* Typing indicator */
    .typing-wrap { display: flex; gap: 12px; align-items: flex-start; padding: 6px 0; }
    .typing-dots {
      display: flex; gap: 4px; align-items: center;
      padding: 10px 14px; background: var(--surface-soft);
      border-radius: 18px 18px 18px 4px;
    }
    .typing-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--mute); animation: tdot 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: .2s; }
    .typing-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes tdot { 0%,80%,100%{transform:scale(.8);opacity:.5} 40%{transform:scale(1);opacity:1} }

    /* ── Input bar (ChatGPT style) ── */
    .input-wrap {
      flex-shrink: 0;
      padding: 12px 20px 20px;
      background: var(--canvas);
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--input-bg);
      border-radius: 16px;
      padding: 10px 12px;
      border: 1px solid var(--hairline);
      transition: border-color 0.15s;
    }
    .input-box:focus-within {
      border-color: var(--hairline-strong);
      background: var(--canvas);
    }

    .attach-btn {
      width: 32px; height: 32px;
      background: none; border: none; cursor: pointer;
      border-radius: 9999px;
      display: flex; align-items: center; justify-content: center;
      color: var(--charcoal); font-size: 16px;
      flex-shrink: 0;
      transition: background 0.1s;
    }
    .attach-btn:hover { background: var(--hairline); }

    #queryInput {
      flex: 1;
      background: none; border: none; outline: none;
      font-family: inherit; font-size: 15px;
      color: var(--ink); line-height: 1.5;
      resize: none; max-height: 200px;
      padding: 2px 0;
      scrollbar-width: none;
    }
    #queryInput::-webkit-scrollbar { display: none; }
    #queryInput::placeholder { color: var(--mute); }

    .send-btn {
      width: 32px; height: 32px;
      background: var(--primary); color: var(--on-primary);
      border: none; border-radius: 9999px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      font-size: 15px; font-weight: 600;
      transition: opacity 0.1s, background 0.1s;
    }
    .send-btn:disabled { background: var(--hairline-strong); cursor: not-allowed; }
    .send-btn:not(:disabled):hover { background: #222; }

    .send-arrow {
      width: 14px; height: 14px;
      border-top: 2px solid currentColor;
      border-right: 2px solid currentColor;
      transform: rotate(-45deg) translate(-1px, 1px);
      display: inline-block;
    }

    .input-hint {
      text-align: center; font-size: 11px;
      color: var(--mute); margin-top: 8px;
    }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.3);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; opacity: 0; pointer-events: none;
      transition: opacity 0.15s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--canvas); border-radius: 16px;
      padding: 28px; width: 380px; max-width: 92vw;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    }
    .modal-title {
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 18px; font-weight: 600; margin-bottom: 14px;
    }
    .modal-input {
      width: 100%; background: var(--surface-soft);
      border: 1px solid var(--hairline); border-radius: 9999px;
      padding: 8px 16px; height: 40px;
      font-size: 15px; font-family: inherit;
      color: var(--ink); outline: none; margin-bottom: 14px;
    }
    .modal-input:focus { border-color: var(--ink); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .btn {
      display: inline-flex; align-items: center; border: none; cursor: pointer;
      font-family: inherit; font-size: 13px; font-weight: 500;
      border-radius: 9999px; padding: 7px 18px; height: 34px;
    }
    .btn-primary { background: var(--primary); color: var(--on-primary); }
    .btn-secondary { background: var(--surface-soft); color: var(--ink); }

    /* ── Upload progress ── */
    .upload-status {
      display: none; align-items: center; gap: 6px;
      font-size: 12px; color: var(--body-color);
      font-family: ui-monospace, monospace;
      padding: 4px 0 0 4px;
    }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: var(--surface-dark); color: var(--on-dark);
      padding: 9px 18px; border-radius: 9999px;
      font-size: 13px; z-index: 1000;
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .toast.show { opacity: 1; }

    #fileInput { display: none; }

    @media (max-width: 640px) {
      .shell { max-width: 100%; }
      .store-select { max-width: 130px; font-size: 12px; }
    }
  </style>
</head>
<body>

<div class="shell">

  <!-- ── Header ── -->
  <header>
    <span class="logo">Quinn</span>

    <button class="btn-icon" title="Upload document" onclick="document.getElementById('fileInput').click()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </button>

    <input type="file" id="fileInput" accept=".txt,.pdf,.md,.docx,.csv,.json,.py,.ts,.js" multiple onchange="onFileSelect(event)" />
  </header>

  <!-- ── Chat area ── -->
  <div class="chat-area" id="chatArea">
    <!-- Welcome shown when empty -->
    <div class="welcome" id="welcome">
      <span class="welcome-q">Q</span>
      <div class="welcome-title">The Future of Lending is Now</div>
    </div>
    <!-- Messages injected here -->
    <div class="messages" id="messages" style="display:none"></div>
  </div>

  <!-- ── Input bar ── -->
  <div class="input-wrap">
    <div class="upload-status" id="uploadStatus">
      <div class="status-dot loading"></div>
      <span id="uploadText">Uploading…</span>
    </div>
    <div class="input-box">
      <button class="attach-btn" title="Attach file" onclick="document.getElementById('fileInput').click()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <textarea
        id="queryInput"
        rows="1"
        placeholder="Ask anything about your documents…"
        onkeydown="onKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendQuery()" title="Send">
        <span class="send-arrow"></span>
      </button>
    </div>
    <div class="input-hint">Powered by Total Quality Lending</div>
  </div>
</div>


<div class="toast" id="toast"></div>

<script>
/* ── State ── */
let currentStore = null;
let isQuerying   = false;
let hasMessages  = false;

/* ── Auto-resize textarea ── */
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

/* ── Enter = send, Shift+Enter = newline ── */
function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendQuery();
  }
}

/* ── Toast ── */
let toastT;
function toast(msg) {
  clearTimeout(toastT);
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  toastT = setTimeout(() => el.classList.remove('show'), 2500);
}

/* ── Escape html ── */
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* ── Markdown rendering via marked.js (tables, lists, bold, code) ── */
if (window.marked) {
  // Defensive: strip italics so stray *word* or _word_ never renders as <em>.
  // Quinn is instructed to never emit italics, this just guarantees it.
  marked.use({
    renderer: {
      em(token) { return token.text; }
    }
  });
  marked.setOptions({ gfm: true, breaks: true });
}
function fmt(t) {
  if (window.marked) {
    return marked.parse(String(t || ''));
  }
  // Fallback if CDN failed
  return esc(t).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
}

/* ── Show messages container ── */
function showMessages() {
  if (!hasMessages) {
    document.getElementById('welcome').style.display = 'none';
    document.getElementById('messages').style.display = 'flex';
    hasMessages = true;
  }
}

function scrollBottom() {
  const ca = document.getElementById('chatArea');
  ca.scrollTop = ca.scrollHeight;
}

/* ── Store (pinned by backend) ── */
async function loadPinnedStore() {
  try {
    const r = await fetch('/api/store');
    const d = await r.json();
    currentStore = d.name;
  } catch { toast('Could not connect to Quinn Knowledge Base'); }
}

/* ── Upload ── */
function onFileSelect(e) { uploadFiles(Array.from(e.target.files)); }

async function uploadFiles(files) {
  if (!currentStore) await loadPinnedStore();
  if (!currentStore) { toast('Could not connect to server'); return; }

  const statusEl = document.getElementById('uploadStatus');
  const statusTx = document.getElementById('uploadText');
  statusEl.style.display = 'flex';

  for (const file of files) {
    statusTx.textContent = `Uploading ${file.name}…`;
    const form = new FormData();
    form.append('file', file);
    form.append('display_name', file.name);
    try {
      const r = await fetch('/api/upload', {method:'POST', body: form});
      if (!r.ok) throw new Error();
      toast(`${file.name} indexed ✓`);
      sysMsg(`"${file.name}" uploaded and indexed.`);
    } catch { toast(`Failed: ${file.name}`); }
  }

  statusEl.style.display = 'none';
  document.getElementById('fileInput').value = '';
}

/* ── Chat ── */
function sysMsg(text) {
  showMessages();
  document.getElementById('messages').insertAdjacentHTML('beforeend',
    `<div class="sys-msg">${esc(text)}</div>`);
  scrollBottom();
}

function addUserMsg(text) {
  showMessages();
  document.getElementById('messages').insertAdjacentHTML('beforeend', `
    <div class="msg msg-user">
      <div class="bubble">${esc(text)}</div>
    </div>`);
  scrollBottom();
}

function addTyping() {
  showMessages();
  document.getElementById('messages').insertAdjacentHTML('beforeend', `
    <div class="msg msg-ai" id="typing">
      <div class="typing-wrap">
        <div class="ai-avatar">Q</div>
        <div class="typing-dots">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    </div>`);
  scrollBottom();
}
function removeTyping() { document.getElementById('typing')?.remove(); }

function addAIMsg(text, _citations) {
  // Citations intentionally not rendered — Quinn's prose carries the answer,
  // PDFs remain reachable via /static/kb-pdfs/* if needed elsewhere.
  const html = `<div class="msg msg-ai">
    <div class="msg-ai-inner">
      <div class="ai-avatar">Q</div>
      <div class="ai-text">${fmt(text)}</div>
    </div>
  </div>`;
  document.getElementById('messages').insertAdjacentHTML('beforeend', html);
  scrollBottom();
}

async function sendQuery() {
  if (isQuerying) return;
  if (!currentStore) await loadPinnedStore();
  if (!currentStore) { toast('Could not connect to server'); return; }
  const input = document.getElementById('queryInput');
  const q = input.value.trim();
  if (!q) return;

  input.value = '';
  input.style.height = 'auto';
  isQuerying = true;
  document.getElementById('sendBtn').disabled = true;

  addUserMsg(q);
  addTyping();

  try {
    const r = await fetch('/api/query', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({question: q, store_names: [currentStore]}),
    });
    const d = await r.json();
    removeTyping();
    addAIMsg(d.answer || d.detail || 'No response.', d.citations);
  } catch {
    removeTyping();
    addAIMsg('Something went wrong. Make sure your store has indexed documents.', []);
  }

  isQuerying = false;
  document.getElementById('sendBtn').disabled = false;

}

/* ── Enable send when typing ── */
document.getElementById('queryInput').addEventListener('input', () => {
  const btn = document.getElementById('sendBtn');
  const val = document.getElementById('queryInput').value.trim();
  btn.disabled = !val;
});

/* ── Init: bind to the pinned Quinn Knowledge Base ── */
async function init() {
  await loadPinnedStore();
}

init();
</script>
</body>
</html>
